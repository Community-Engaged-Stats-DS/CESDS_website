project:
  type: website
  output-dir: docs
  execute-dir: project

execute:
  freeze: auto      

website:
  title: "Community Engaged Statistics and Data Science (CESDS)"
  description: "Website about training, plannning, and implementation of community engaged statistics and data courses."
  site-url: https://community-engaged-stats-ds.github.io/CESDS_website/about.html 
  repo-url: https://github.com/Community-Engaged-Stats-DS/CESDS_website 

  #favicon: assets/favicon.png
  open-graph: true
  #twitter-card: true

  #reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    location: navbar
    type: overlay
    copy-button: true

  navbar:
    pinned: true
    right:
      - href: index.qmd
        text: About
      - href: activity.qmd
        text: Activity
      - href: https://community-engaged-stats-ds.github.io/CESDS_handbook/
        text: Handbook
      - icon: github
        href: https://github.com/Community-Engaged-Stats-DS/CESDS_website
        aria-label: "Source on GitHub"

  page-footer:
    border: true
    left: 'Built with [Quarto](https://quarto.org) and <span class="bi bi-heart-fill"></span>'
    # right:
    #   - text: "License"
    #     href: license.qmd

format:
  html:
    theme: [brand, custom.scss]

    toc: false
    page-layout: full
    toc-location: right
    toc-depth: 3
    toc-expand: 2

    anchor-sections: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    lightbox: false

    link-external-newwindow: true
    link-external-icon: true

    code-copy: true
    code-link: true
    code-overflow: wrap
    highlight-style: arrow

    fig-format: svg
    fig-width: 7
    fig-height: 4.5
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    df-print: kable


